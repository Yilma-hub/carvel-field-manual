<title>Carvel Field Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>
/* Layout: field-book manual. Sticky top bar; each section is a row with a "Plain talk" card on the left and the technical text on the right; glossary opens in a right-side panel; chapters in a drawer. */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --plain:#E9F0E2; --plain-edge:#C9D8BC;
  --ink:#16241E; --muted:#56655D; --line:#D4DCD2; --line-strong:#AEBBB1;
  --accent:#17698A; --accent-soft:rgba(23,105,138,.09); --gold:#B07F12; --gold-soft:rgba(176,127,18,.13);
  --soil:#8A5A35; --leaf:#3E7B3A; --leaf-2:#6FA35A; --water:#2F86B8; --sky:#DCEBF3;
  --good:#2E7D4F; --warn:#A8710F; --bad:#B23A3A; --quote:#F7F3E8; --quote-edge:#D9C9A0;
  --shadow:0 8px 28px rgba(22,36,30,.14);
  --f-display:"Barlow Condensed","Noto Sans Ethiopic","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Noto Sans Ethiopic","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --top:56px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#151F1A; --plain:#1A2820; --plain-edge:#2E4636;
  --ink:#E3EBE5; --muted:#9BABA2; --line:#28372F; --line-strong:#3D5046;
  --accent:#62B6D6; --accent-soft:rgba(98,182,214,.12); --gold:#E2B54A; --gold-soft:rgba(226,181,74,.14);
  --soil:#C99A70; --leaf:#7DBA6E; --leaf-2:#5C9150; --water:#5BA8D6; --sky:#1B2C36;
  --good:#5FBF84; --warn:#E0A84A; --bad:#E07070; --quote:#211F18; --quote-edge:#5A4F33;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#151F1A; --plain:#1A2820; --plain-edge:#2E4636;
  --ink:#E3EBE5; --muted:#9BABA2; --line:#28372F; --line-strong:#3D5046;
  --accent:#62B6D6; --accent-soft:rgba(98,182,214,.12); --gold:#E2B54A; --gold-soft:rgba(226,181,74,.14);
  --soil:#C99A70; --leaf:#7DBA6E; --leaf-2:#5C9150; --water:#5BA8D6; --sky:#1B2C36;
  --good:#5FBF84; --warn:#E0A84A; --bad:#E07070; --quote:#211F18; --quote-edge:#5A4F33;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--line-strong);background:var(--accent-soft)}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em;white-space:nowrap;cursor:pointer}
.brand small{font-weight:500;color:var(--muted);font-size:15px;margin-left:6px}
.search{flex:1;max-width:520px;position:relative;min-width:0}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
.results{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:60}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.results button:hover,.results button.on{background:var(--accent-soft)}
.results .k{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.results .x{font-size:13px;color:var(--muted)}
.mode{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mode button{border:0;background:transparent;padding:0 10px;height:36px;cursor:pointer;font-size:14px}
.mode button.on{background:var(--accent);color:var(--surface)}
.toplinks{display:flex;gap:6px}
@media (max-width:860px){.brand small,.toplinks .lbl{display:none}.mode button{padding:0 7px;font-size:13px}}
@media (max-width:480px){.toplinks{display:none}}
@media (max-width:620px){.brand{font-size:18px}.top{gap:6px;padding:0 10px}.mode{display:none}}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.35);z-index:45}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,88vw);background:var(--surface);z-index:50;border-right:1px solid var(--line);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.drawer h3{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.drawer a{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:15px}
.drawer a:hover{background:var(--accent-soft)}
.drawer a.on{background:var(--accent);color:var(--surface)}

/* Main */
.wrap{padding-inline:16px;padding-block:18px 60px;max-width:1280px;margin:0 auto;transition:margin .2s}
body.panel-open .wrap{margin-right:min(440px,40vw)}
@media (max-width:1100px){body.panel-open .wrap{margin-right:auto}}
.crumb{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1.ptitle{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.2vw,44px);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.lede{font-size:18px;color:var(--muted);max-width:70ch;margin:0 0 14px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.toc a{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink);background:var(--surface)}
.toc a:hover{border-color:var(--accent)}

.sec{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:18px;margin:0 0 22px;scroll-margin-top:calc(var(--top) + 12px)}
.sec>h2{grid-column:1/-1;font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.1;margin:10px 0 -4px;text-wrap:balance;border-top:2px solid var(--line);padding-top:14px}
.plain{background:var(--plain);border:1px solid var(--plain-edge);border-radius:12px;padding:14px 16px;align-self:start;position:sticky;top:calc(var(--top) + 12px);max-height:calc(100vh - var(--top) - 24px);overflow:auto;min-width:0}
.plain .tag,.tech .tag{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.plain .tag{color:var(--leaf)}
.tech{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:0}
.tech .tag{color:var(--accent)}
.plain p,.tech p,.plain li,.tech li{max-width:72ch}
.plain p:first-of-type,.tech p:first-of-type{margin-top:4px}
body.m-plain .tech{display:none} body.m-plain .sec{grid-template-columns:minmax(0,1fr)} body.m-plain .plain{position:static;max-height:none}
body.m-tech .plain{display:none} body.m-tech .sec{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.sec{grid-template-columns:minmax(0,1fr)}.plain{position:static;max-height:none}}

.tech h3,.plain h3{font-family:var(--f-display);font-size:20px;font-weight:600;margin:18px 0 4px}
.tech h4{font-size:16px;margin:14px 0 2px}
.tech ul,.tech ol,.plain ul,.plain ol{padding-left:22px}
.tech li{margin:3px 0}
.tablewrap{overflow-x:auto;margin:10px 0 14px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
code,.mono{font-family:var(--f-mono);font-size:.9em}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-family:var(--f-mono);font-size:14px;line-height:1.5}
pre code{font-size:inherit}
blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--line-strong);color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.note{background:var(--gold-soft);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:15px}

/* Quotes */
.vq{background:var(--quote);border:1px solid var(--quote-edge);border-radius:12px;padding:12px 16px 10px;margin:14px 0;position:relative}
.vq .vk{font-family:var(--f-display);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soil);font-weight:600}
.vq q{display:block;font-size:17px;line-height:1.45;margin:4px 0 6px;quotes:"\201C" "\201D"}
.vq .who{font-size:14px;color:var(--muted)}
.vq .who b{color:var(--ink);font-weight:600}

/* Figures */
figure.fig{margin:14px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 10px 6px}
figure.fig .svgwrap{overflow-x:auto}
figure.fig svg{display:block;width:100%;height:auto;min-width:560px}
figure.fig.sm svg{min-width:0;max-width:640px;margin:0 auto}
@media (min-width:901px){.plain figure.fig svg{min-width:0}}
.plain .calc .cbody{grid-template-columns:minmax(0,1fr)}
td .gl,li .gl{text-align:left}
figure.fig figcaption{font-size:13.5px;color:var(--muted);padding:6px 4px 2px}
figure.fig figcaption b{color:var(--ink);font-weight:600}

/* Calculators */
.calc{border:1px solid var(--accent);border-radius:12px;margin:14px 0 18px;overflow:hidden;background:var(--surface)}
.calc>header{background:var(--accent-soft);padding:8px 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.calc>header .ck{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.calc>header .ct{font-family:var(--f-display);font-size:20px;font-weight:600}
.calc .cbody{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
@media (max-width:760px){.calc .cbody{grid-template-columns:minmax(0,1fr)}}
.calc .ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px;align-content:start}
.calc label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
.calc input,.calc select,.calc textarea{border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;background:var(--bg);font-family:var(--f-mono);font-size:14px;width:100%}
.calc textarea{min-height:110px;grid-column:1/-1}
.calc label.wide{grid-column:1/-1}
.calc .outs{min-width:0}
.calc .big{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.calc .big div{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:120px;background:var(--bg)}
.calc .big span{display:block;font-size:12px;color:var(--muted)}
.calc .big strong{font-family:var(--f-mono);font-size:19px;font-weight:600}
.calc .how{font-size:13.5px;color:var(--muted);margin-top:6px}
.calc .ok{color:var(--good)} .calc .wn{color:var(--warn)} .calc .bd{color:var(--bad)}

/* Glossary links, tooltip, panel */
.gl{border-bottom:1.5px dotted var(--accent);cursor:help;color:inherit;text-decoration:none;background:transparent;padding:0;border-top:0;border-left:0;border-right:0;font:inherit;line-height:inherit}
.gl:hover,.gl:focus{background:var(--accent-soft);border-bottom-style:solid}
.tip{position:fixed;z-index:70;max-width:340px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:9px 12px;font-size:14px;line-height:1.45;pointer-events:none}
.tip b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;margin-bottom:2px}
.tip .hint{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.panel{position:fixed;top:calc(var(--top) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:35;overflow:auto;box-shadow:var(--shadow);padding:14px 18px calc(30px + env(safe-area-inset-bottom,0px))}
@media (max-width:1100px){.panel{z-index:55}}
.panel .pk{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.panel h2{font-family:var(--f-display);font-size:30px;line-height:1.05;margin:2px 0 6px}
.panel .ab{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.panel .short{font-size:16px;background:var(--plain);border:1px solid var(--plain-edge);border-radius:8px;padding:8px 10px;margin:8px 0}
.panel .rel{display:flex;flex-wrap:wrap;gap:6px}
.panel .rel button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px}
.panel .rel button:hover{border-color:var(--accent)}
.panel .uses a{display:block;font-size:14px;padding:2px 0}
.panel .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--surface);padding:6px 0;z-index:2}
.panel .navb{display:flex;gap:6px}

/* Home + listings */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:14px 0}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--accent)}
.tile .tk{font-family:var(--f-display);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.tile .tt{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.1}
.tile .td{font-size:14px;color:var(--muted)}
.grp{font-family:var(--f-display);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 0;border-bottom:1px solid var(--line);padding-bottom:4px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.pager a{border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink);background:var(--surface);max-width:48%}
.pager a span{display:block;font-size:12px;color:var(--muted)}
.gloss-list{columns:2 300px;column-gap:28px}
.gloss-list div{break-inside:avoid;margin:0 0 10px}
.gloss-list button{border:0;background:transparent;padding:0;cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--accent);text-align:left}
.gloss-list p{margin:0;font-size:14px;color:var(--muted)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.letters a{font-family:var(--f-mono);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.filter{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 12px;width:min(420px,100%);background:var(--surface)}
/* Notes */
.notes{margin:-8px 0 26px;border:1px dashed var(--line-strong);border-radius:10px;padding:8px 12px;background:var(--surface)}
.notes.has{border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
.notes .nhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.notes .nk{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.notes .nbtn{border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:13.5px}
.notes .nbtn:hover{border-color:var(--gold)}
.notes .nstat{font-size:12.5px;color:var(--muted)}
.notes .nview{font-size:15px}.notes .nview p{margin:6px 0}
.notes .nta{display:none;width:100%;min-height:110px;margin-top:8px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--bg);font:inherit;resize:vertical}
.notes.editing .nta{display:block}.notes.editing .nview{display:none}
.nbar{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.nitem{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;margin:8px 0}
.nitem a{font-weight:600}
/* Language tabs and Amharic */
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:0 10px;height:36px;cursor:pointer;font-size:14px;white-space:nowrap}
.lang button.on{background:var(--gold);color:var(--surface)}
body.lang-am{--f-body:"Noto Sans Ethiopic","Source Sans 3",sans-serif;--f-display:"Noto Sans Ethiopic","Barlow Condensed",sans-serif;font-size:16px;line-height:1.7}
body.lang-am .tag,body.lang-am .vk,body.lang-am .ck,body.lang-am .pk,body.lang-am .grp,body.lang-am .tk{letter-spacing:0;text-transform:none}
.vq .orig{font-size:13.5px;color:var(--muted);font-style:italic;margin:0 0 6px}.vq .orig summary{cursor:pointer;font-style:normal;list-style:none;display:inline-block;border-bottom:1px dotted var(--muted)}.vq .orig summary::-webkit-details-marker{display:none}.vq .orig summary::before{content:"+ "}.vq .orig[open] summary::before{content:"\2212  "}.vq .orig[open] summary{margin-bottom:4px}
@media (max-width:480px){.lang button{padding:0 7px;font-size:13px}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="Open chapters" title="Chapters">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
  <div class="brand" id="brand">Carvel Field Manual<small>Irrigation and precision ag</small></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search pages, terms, calculators" autocomplete="off" aria-label="Search">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="mode" role="group" aria-label="Reading mode">
    <button data-m="both" class="on" title="Plain talk and technical side by side">Both</button>
    <button data-m="plain" title="Only the plain-talk version">Plain</button>
    <button data-m="tech" title="Only the technical version">Technical</button>
  </div>
  <div class="toplinks">
    <button class="iconbtn" id="calcBtn" title="All calculators"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="1.5" width="12" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 4.5h7M5 8h1M8 8h1M11 8h.5M5 11h1M8 11h1M11 11h.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="lbl">Calculators</span></button>
    <button class="iconbtn" id="glossBtn" title="Glossary"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7.5a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2z M3 11.5a2 2 0 0 1 2-2h7.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="lbl">Glossary</span></button>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="en" class="on" lang="en">English</button>
    <button data-l="am" lang="am">አማርኛ</button>
  </div>
</header>

<div class="scrim" id="scrim" hidden></div>

<script src="glossary3.js"></script>
